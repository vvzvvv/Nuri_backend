name: "Chore"
description: 설정, 의존성, 빌드, CI 등 기능과 직접 관련 없는 잡일에 사용합니다.
title: "[Chore] "
labels: ["type: chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을 할 것인지 설명해주세요.
      placeholder: 예) ESLint 설정 추가, GitHub Actions CI 파이프라인 구성
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 왜 이 작업이 필요한지 간단히 적어주세요.
    validations:
      required: false
