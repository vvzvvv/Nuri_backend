name: "Bug"
description: 예상과 다르게 동작하는 부분을 보고할 때 사용합니다.
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ~~ 페이지로 이동
        2. ~~ 버튼 클릭
        3. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래는 어떻게 동작해야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      placeholder: 예) OS, 브라우저, 버전 등
    validations:
      required: false
