name: "Feature"
description: 새로운 기능을 추가할 때 사용합니다.
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 배경 / 동기
      description: 이 기능이 왜 필요한지 설명해주세요.
      placeholder: 예) 사용자가 게시글을 검색할 방법이 없어서 불편함
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 구현할 내용을 체크리스트로 정리해주세요.
      placeholder: |
        - [ ] 검색 API 엔드포인트 추가
        - [ ] 검색 UI 컴포넌트 작성
        - [ ] 검색 결과 페이지네이션
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 언제 이 작업이 끝났다고 볼 수 있는지 명시해주세요.
      placeholder: 예) 키워드로 게시글 제목/내용 검색이 가능하고, 결과가 10개 단위로 페이징된다.
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 관련 이슈 / 참고 자료
      description: 연관된 이슈, PR, 문서 링크 등이 있다면 적어주세요.
    validations:
      required: false
